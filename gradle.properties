# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC

# AndroidX
android.useAndroidX=true
android.enableJetifier=false

# Non-transitive R classes would require source updates (R.attr.colorAccent,
# switch on R.id.*). Leave disabled to keep the legacy Java sources compiling.
android.nonTransitiveRClass=false

# AGP 8 makes R fields non-final by default, which breaks `switch(R.id.*)`
# statements throughout the legacy Java sources. Keep them final.
android.nonFinalResIds=false

# Suppress unsupported compileSdk warnings during preview SDK bumps
android.suppressUnsupportedCompileSdk=36

# When configured, Gradle will run in incubating parallel mode.
org.gradle.parallel=true
org.gradle.caching=true
# configuration-cache disabled: rclone build script uses dynamic exec tasks
# that are not configuration-cache compatible.
# org.gradle.configuration-cache=true
