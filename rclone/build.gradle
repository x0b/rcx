// This is the rclone build script. It builds the rclone shared library for
// Android using the Go toolchain and the Android NDK cross-compiler.
//
// Supported Android targets:
//  - arm64-v8a (64-bit ARM, the only ABI shipped by this fork)
//
// Supported host systems:
//  - linux x86_64
//  - mac os x86_64 / arm64
//  - windows x86_64
//
// Prerequisites:
//  - go 1.23+
//  - Android NDK (version matched to app/build.gradle)

// Rclone version - any git reference (tag, branch, hash) should work
def buildTag = 'v1.74.4'
ext.ndkVersion = '30.0.15729638'

//
// DO NOT EDIT ANYTHING BELOW
//
import java.nio.file.Paths
import java.nio.file.Files
import java.util.Properties

def configureNdk() {
    def osName = System.properties['os.name'].toLowerCase()
    def osArch = System.properties['os.arch']

    def os = ''
    if (osName.contains('windows')) {
        if (osArch.equals('amd64') || osArch.equals('x86_64')) {
            os = "windows-x86_64"
        } else {
            throw new GradleException("Windows on ${osArch} is not supported")
        }
    } else if (osName.contains("linux")) {
        os = "linux-x86_64"
    } else if (osName.contains('mac')) {
        // Apple Silicon Macs use darwin-x86_64 via Rosetta, native arm64 not
        // shipped by the NDK.
        os = "darwin-x86_64"
    } else {
        throw new GradleException("OS=${osName}/ARCH=${osArch} not supported")
    }

    // locate NDK: prefer ANDROID_NDK_HOME, then $ANDROID_HOME/ndk/<version>,
    // then the Studio-default local SDK location.
    def candidates = []
    def envNdk = System.getenv('ANDROID_NDK_HOME')
    if (envNdk != null) candidates << Paths.get(envNdk)
    def envHome = System.getenv('ANDROID_HOME')
    if (envHome != null) candidates << Paths.get(envHome, 'ndk', ext.ndkVersion)
    def localHome = Paths.get(System.getProperty('user.home'), 'AppData', 'Local', 'Android', 'Sdk')
    if (Files.exists(localHome)) candidates << localHome.resolve(Paths.get('ndk', ext.ndkVersion))
    def envSdkRoot = System.getenv('ANDROID_SDK_ROOT')
    if (envSdkRoot != null) candidates << Paths.get(envSdkRoot, 'ndk', ext.ndkVersion)

    def ndkBasePath = null
    for (c in candidates) {
        if (Files.exists(c) && checkNdk(c)) {
            ndkBasePath = c
            break
        }
    }

    if (ndkBasePath == null) {
        throw new GradleException("NDK ${ext.ndkVersion} not found. Tried: ${candidates}")
    }

    println "rclone: using NDK at ${ndkBasePath}"
    return ndkBasePath.resolve(Paths.get('toolchains', 'llvm', 'prebuilt', os, 'bin'))
}

def checkNdk(ndkBasePath) {
    def propertiesPath = ndkBasePath.resolve('source.properties')
    if (!Files.exists(propertiesPath)) return false
    def ndkProperties = new Properties()
    ndkProperties.load(file(propertiesPath).newReader())
    def revision = ndkProperties['Pkg.Revision']
    return revision != null && revision.startsWith(ext.ndkVersion)
}

def configureGo() {
    def localGo = Paths.get('golang', 'go', 'bin', 'go' + (System.properties['os.name'].toLowerCase().contains('windows') ? '.exe' : ''))
    return Files.exists(localGo) ? localGo.toAbsolutePath().toString() : 'go'
}

def repository = 'github.com/rclone/rclone'
def repositoryRef = repository + '@' + buildTag
def ldflags = "-X github.com/rclone/rclone/fs.Version=${buildTag}-rcx"
def goPath = Paths.get(projectDir.absolutePath, 'gopath').toAbsolutePath().toString()
def appLibPath = Paths.get(projectDir.absolutePath, '../app/lib').toAbsolutePath().toString()
def ndkPrefix = configureNdk()
def goBinary = configureGo()

def rcloneSourceDir = Paths.get(goPath, 'pkg', 'mod', 'github.com', 'rclone', "rclone@${buildTag}".toString()).toFile()

task fetchRclone(type: Exec) {
    doFirst {
        mkdir "gopath"
    }
    environment 'GOPATH', goPath
    environment 'GO111MODULE', 'on'
    // rclone v1.74+ uses a Go module; `go mod download` is the supported way
    // to fetch the source for a given version into $GOPATH/pkg/mod.
    workingDir projectDir
    commandLine goBinary, 'mod', 'download', repositoryRef
    doLast {
        println "rclone: source at ${rcloneSourceDir}"
    }
}

task cleanNative {
    enabled = true
    doLast {
        delete "${appLibPath}/arm64-v8a/librclone.so"
    }
}

task buildArm64(type: Exec) {
    dependsOn fetchRclone
    environment 'GOPATH', goPath
    def crossCompiler = ndkPrefix.resolve('aarch64-linux-android24-clang')
    environment 'CC', crossCompiler.toString()
    environment 'CC_FOR_TARGET', crossCompiler.toString()
    environment 'GOOS', 'android'
    environment 'GOARCH', 'arm64'
    environment 'CGO_ENABLED', '1'
    environment 'CGO_LDFLAGS', "-fuse-ld=lld -s"
    environment 'GOFLAGS', '-mod=mod'
    workingDir rcloneSourceDir
    def artifactTarget = "${appLibPath}/arm64-v8a/librclone.so"
    doFirst { new File(artifactTarget).parentFile.mkdirs() }
    commandLine goBinary, 'build', '-v', '-tags', 'android noselfupdate', '-trimpath', '-ldflags', ldflags, '-o', artifactTarget, '.'
    doLast {
        println "rclone: built ${artifactTarget}"
    }
}

task buildNative {
    dependsOn buildArm64
}

task prepareKotlinBuildScriptModel {
    // ignore, does not build from kotlin sources
}

buildNative.mustRunAfter(buildArm64)
defaultTasks 'buildNative'
